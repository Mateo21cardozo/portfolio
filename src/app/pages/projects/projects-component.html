<section id="projects" class="projects-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="section-title">Proyectos</h2>
    </div>

    <div class="row">
      <div class="col-lg-4 col-md-6 mb-4" *ngFor="let project of projects">
        <div class="project-card card h-100 shadow-sm border-0">
          <div class="project-img text-center py-4">
            <img [src]="project.logo" width="250" alt="logo" />
          </div>

          <div class="project-body card-body text-center">
            <h4 class="project-title mb-3">{{ project.title }}</h4>

            <!-- Show short description if NOT expanded -->
            <ng-container
              *ngIf="expandedProjectId !== project.id; else fullDesc"
            >
              <p>{{ project.description | shorten:150 }}</p>

              <span
                *ngIf="project.description && project.description.length > 150"
                class="see-more ms-2"
                style="color: #7a5af8; cursor: pointer"
                (click)="toggleDescription(project.id)"
              >
                Ver más
              </span>
            </ng-container>

            <!-- Show full description when expanded -->
            <ng-template #fullDesc>
              <p>{{ project.description }}</p>
              <span
                class="see-less ms-2"
                style="color: #7a5af8; cursor: pointer"
                (click)="toggleDescription(project.id)"
              >
                Ver menos
              </span>
            </ng-template>

            <div class="project-tags mt-3">
              <span
                class="badge bg-light text-dark me-2"
                *ngFor="let tag of project.tags"
              >
                {{ tag }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
